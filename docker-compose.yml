services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: aicte
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte"]
      interval: 5s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://aicte:local-demo-only@db/aicte
      DEMO_MODE: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://aicte:local-demo-only@db/aicte
    depends_on:
      app:
        condition: service_healthy
volumes:
  database:
